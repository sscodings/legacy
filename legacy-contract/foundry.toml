[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.36"
optimizer = true
optimizer_runs = 200

# Monad execution network: applies Monad's gas model, opcode pricing,
# transaction rules, 128 KB contract limit and 256 KB initcode limit.
# Requires Foundry >= 1.8. Supersedes a manual `evm_version` setting.
network = "monad"

# Chain-neutral profile for the legacy World Chain deployment, which must
# keep building and testing under standard EVM semantics.
[profile.worldchain]
evm_version = "cancun"

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
worldchain_sepolia = "${WORLDCHAIN_SEPOLIA_RPC_URL}"
monad = "https://rpc.monad.xyz"
monad_testnet = "https://testnet-rpc.monad.xyz"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
worldchain_sepolia = { key = "${ETHERSCAN_API_KEY}", url = "https://api.etherscan.io/v2/api?chainid=4801" }
